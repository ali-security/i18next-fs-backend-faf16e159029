name: node

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha selector (test file paths); empty runs the full suite'
        required: false
        type: string
        default: ''

jobs:
  test:
    name: Test on node ${{ matrix.node }} and ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        node: [ '24.x', '22.x', '20.x' ]
        # os: [ubuntu-latest, windows-latest, macOS-latest]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Pin npm registry to the release-date time machine
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-04-23T00:00:00.000000Z
      - run: npm install
      - run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run build && npx mocha ${{ inputs.test-filter }} -R spec --exit --experimental-modules
          else
            npm test
          fi
      - name: Pack the release tarball
        if: matrix.node == '24.x'
        run: npm pack
      - name: Upload the release tarball
        if: matrix.node == '24.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: i18next-fs-backend-2.6.5.tgz
          if-no-files-found: error